name: Update YouTube videos and playlists

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest videos and playlists
        run: python .github/scripts/fetch_videos.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- fun-portfolio/videos.json fun-portfolio/playlists.json)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fun-portfolio/videos.json fun-portfolio/playlists.json
          git commit -m "Update YouTube videos and playlists"
          git push
